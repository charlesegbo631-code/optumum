<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Login | uchenzylogs</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <script src="/scripts/sweetalert2.all.min.js"></script>

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg, #f5f7fb);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      color: var(--text, #333);
      transition: 0.3s;
    }

    .card {
      background: var(--card-bg, #fff);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 6px 18px var(--shadow, rgba(0,0,0,0.05));
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      color: var(--accent, #0a7c58);
      margin-bottom: 1rem;
    }

    input {
      width: 100%;
      padding: 0.8rem;
      margin-top: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      background: var(--card-bg);
      color: var(--text);
    }

    button {
      margin-top: 1.5rem;
      background: var(--accent, #0a7c58);
      color: #fff;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
    }

    button:hover {
      opacity: 0.9;
    }

    a {
      display: block;
      margin-top: 1rem;
      text-decoration: none;
      color: var(--accent, #0a7c58);
      font-weight: 600;
    }

    /* THEME VARIABLES */
    :root {
      --bg: #f5f7fb;
      --text: #333;
      --header-bg: #fff;
      --card-bg: #fff;
      --accent: #0a7c58;
      --shadow: rgba(0,0,0,0.05);
    }

    body.dark {
      --bg: #090f18;
      --text: #e6edf3;
      --header-bg: #161b22;
      --card-bg: #1f242c;
      --accent: #3cba92;
      --shadow: rgba(0,0,0,0.4);
    }

    /************************************
        MOBILE RESPONSIVE FIXES
    *************************************/
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 1.4rem;
        border-radius: 14px;
      }

      input {
        padding: 0.7rem;
        font-size: 0.95rem;
      }

      button {
        padding: 0.75rem;
        font-size: 0.95rem;
      }

      h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // Apply saved theme
  const savedTheme = localStorage.getItem("theme");
  if (savedTheme === "dark") {
    document.body.classList.add("dark");
  }

  // Optional theme toggle button
  const themeBtn = document.getElementById("themeBtn");
  if (themeBtn) {
    themeBtn.textContent = document.body.classList.contains("dark")
      ? "☀️ Light Mode"
      : "🌙 Dark Mode";

    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      const darkMode = document.body.classList.contains("dark");
      localStorage.setItem("theme", darkMode ? "dark" : "light");

      themeBtn.textContent = darkMode
        ? "☀️ Light Mode"
        : "🌙 Dark Mode";
    });
  }
});
</script>

<body>
  <div class="card">
    <h1>Welcome Back 👋</h1>

    <input id="email" type="email" placeholder="Email" required />
    <input id="password" type="password" placeholder="Password" required />

    <button id="loginBtn">Login</button>
    <a href="/register.html">Create Account</a>
  </div>

  <script>
    const apiBase = "http://localhost:4000";
    const loginBtn = document.getElementById("loginBtn");

    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        return Swal.fire("Error", "Please enter both email and password.", "error");
      }

      try {
        const res = await fetch(`${apiBase}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Login failed");

        // Save token
        localStorage.setItem("token", data.token);

        Swal.fire("Success", "Login successful!", "success");

        setTimeout(() => {
          window.location.href = "/dashboard.html";
        }, 1000);

      } catch (err) {
        Swal.fire("Error", err.message, "error");
      }
    });
  </script>
</body>
</html>
