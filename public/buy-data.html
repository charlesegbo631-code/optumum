<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy Data | uchenzylogs</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <script src="/scripts/sweetalert2.all.min.js"></script>

  <style>
    :root {
      --bg: #f5f7fb;
      --text: #333;
      --card-bg: #fff;
      --accent: #0a7c58;
      --shadow: rgba(0, 0, 0, 0.05);

      /* MOBILE SIZES */
      --radius: 14px;
      --pad: 1.3rem;
      --input-pad: 0.85rem;
    }

    body.dark {
      --bg: #0a101a;
      --text: #e6edf3;
      --card-bg: #1c2128;
      --accent: #3cba92;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
      transition: background 0.3s ease, color 0.3s ease;
    }

    h1 {
      text-align: center;
      color: var(--accent);
      margin-bottom: 1.5rem;
      font-size: 1.7rem;
    }

    .form-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: var(--pad);
      box-shadow: 0 8px 20px var(--shadow);
      transition: 0.3s ease;
    }

    label {
      display: block;
      margin-top: 0.9rem;
      font-weight: 600;
      font-size: 0.95rem;
    }

    select, input {
      width: 100%;
      padding: var(--input-pad);
      border-radius: var(--radius);
      border: 1px solid #ccc;
      margin-top: 0.4rem;
      font-size: 1rem;
      background: var(--card-bg);
      color: var(--text);
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 1rem;
      border-radius: var(--radius);
      font-weight: 600;
      width: 100%;
      margin-top: 1.4rem;
      cursor: pointer;
      font-size: 1.05rem;
      transition: 0.3s;
    }

    button:hover { opacity: 0.9; }

    .back {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    #themeBtn {
      position: fixed;
      top: 15px;
      right: 15px;
      background: transparent;
      border: 1px solid var(--accent);
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      z-index: 99;
    }

    @media screen and (max-width: 480px) {
      h1 { font-size: 1.5rem; }
      .form-card { padding: 1.2rem; }
      button { padding: 0.9rem; font-size: 1rem; }
    }
  </style>
</head>

<body>
<script>
  // Apply theme instantly
  (() => {
    const saved = localStorage.getItem("theme") || "light";
    if (saved === "dark") document.body.classList.add("dark");
  })();
</script>


<h1>📶 Buy Data</h1>

<div class="form-card">

  <label for="network">Select Network</label>
  <select id="network">
    <option value="">-- Choose Network --</option>
    <option value="mtn">MTN</option>
    <option value="airtel">Airtel</option>
    <option value="glo">Glo</option>
    <option value="9mobile">9mobile</option>
  </select>

  <label for="plan">Select Data Plan</label>
  <select id="plan">
    <option value="">-- Select Plan --</option>
  </select>

  <label for="phone">Enter Phone Number</label>
  <input type="text" id="phone" placeholder="e.g. 08012345678" maxlength="11" />

  <button id="buyBtn">💳 Buy Data</button>

  <a href="/dashboard.html" class="back">⬅ Back to Dashboard</a>
</div>


<script>
/* =============================
      THEME SWITCHER
============================= */
document.addEventListener("DOMContentLoaded", () => {
  const themeBtn = document.getElementById("themeBtn");

  const updateBtn = () => {
    themeBtn.textContent = document.body.classList.contains("dark")
      ? "☀️ Light Mode"
      : "🌙 Dark Mode";
  };

  updateBtn();

  themeBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    localStorage.setItem(
      "theme",
      document.body.classList.contains("dark") ? "dark" : "light"
    );
    updateBtn();
  });
});


/* =============================
      MAIN BUY LOGIC
============================= */
document.addEventListener("DOMContentLoaded", () => {

  const token = localStorage.getItem("token");
  if (!token) {
    Swal.fire("Login Required", "Please log in.", "warning")
      .then(() => window.location.href = "/login.html");
    return;
  }

  const apiBase = "http://localhost:4000";
  const networkSelect = document.getElementById("network");
  const planSelect = document.getElementById("plan");
  const phoneInput = document.getElementById("phone");
  const buyBtn = document.getElementById("buyBtn");

  let balance = 0;

  const dataPlans = {
    mtn: [
      { name: "500MB - ₦150", code: "mtn-500mb", price: 150 },
      { name: "1GB - ₦300", code: "mtn-1gb", price: 300 },
      { name: "2GB - ₦500", code: "mtn-2gb", price: 500 }
    ],
    airtel: [
      { name: "1GB - ₦300", code: "airtel-1gb", price: 300 },
      { name: "2GB - ₦500", code: "airtel-2gb", price: 500 }
    ],
    glo: [
      { name: "500MB - ₦200", code: "glo-500mb", price: 200 },
      { name: "1GB - ₦400", code: "glo-1gb", price: 400 }
    ],
    "9mobile": [
      { name: "1GB - ₦300", code: "9mobile-1gb", price: 300 },
      { name: "2GB - ₦600", code: "9mobile-2gb", price: 600 }
    ]
  };

  async function loadWallet() {
    try {
      const res = await fetch(`${apiBase}/wallet`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();

      if (res.ok) balance = data.balance;
      else Swal.fire("Error", data.error);
    } catch (err) {
      Swal.fire("Error", err.message);
    }
  }

  loadWallet();

  networkSelect.addEventListener("change", () => {
    planSelect.innerHTML = '<option value="">-- Select Plan --</option>';

    const plans = dataPlans[networkSelect.value];
    if (plans) {
      plans.forEach(plan => {
        const opt = document.createElement("option");
        opt.value = plan.code;
        opt.textContent = plan.name;
        planSelect.appendChild(opt);
      });
    }
  });

  buyBtn.addEventListener("click", async () => {
    const network = networkSelect.value;
    const planCode = planSelect.value;
    const phone = phoneInput.value.trim();
    const plan = dataPlans[network]?.find(p => p.code === planCode);

    if (!network || !planCode || !phone)
      return Swal.fire("Error", "Please fill all fields.");

    if (balance < plan.price)
      return Swal.fire("Insufficient Funds", `Wallet: ₦${balance}`);

    Swal.fire({
      title: "Processing...",
      text: `Buying ${plan.name} for ${phone}`,
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });

    try {
      const res = await fetch(`${apiBase}/api/data`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          network,
          phone,
          variation_code: plan.code
        })
      });

      const data = await res.json();

      if (!res.ok) throw new Error(data.error);

      Swal.fire("Success", `${data.message}\nNew balance: ₦${data.new_balance}`, "success");
      balance = data.new_balance;

    } catch (err) {
      Swal.fire("Error", err.message);
    }
  });
});
</script>

</body>
</html>
