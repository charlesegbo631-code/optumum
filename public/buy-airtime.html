<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy Airtime | uchenzylogs</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <script src="/scripts/sweetalert2.all.min.js"></script>

  <style>
    :root {
      --bg: #f5f7fb;
      --text: #333;
      --card-bg: #fff;
      --accent: #0a7c58;
      --shadow: rgba(0, 0, 0, 0.06);
    }

    /* Dark Mode */
    body.dark {
      --bg: #0a101a;
      --text: #e6edf3;
      --card-bg: #1c2128;
      --accent: #3cba92;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem;
      transition: 0.3s ease;
    }

    h1 {
      text-align: center;
      color: var(--accent);
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
    }

    .form-card {
      background: var(--card-bg);
      border-radius: 16px;
      max-width: 480px;
      margin: auto;
      padding: 1.5rem;
      box-shadow: 0 8px 18px var(--shadow);
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
      font-size: 0.95rem;
    }

    select,
    input {
      width: 100%;
      padding: 0.9rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-top: 0.5rem;
      font-size: 1rem;
      background: var(--card-bg);
      color: var(--text);
      transition: 0.3s;
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 1rem;
      border-radius: 10px;
      font-weight: 600;
      width: 100%;
      margin-top: 1.7rem;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      opacity: 0.9;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
    }

    /* Theme Button */
    #themeBtn {
      position: fixed;
      top: 15px;
      right: 15px;
      background: transparent;
      border: 1px solid var(--accent);
      padding: 0.5rem 1rem;
      border-radius: 10px;
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      body {
        padding: 0.8rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .form-card {
        padding: 1.2rem;
      }
      select,
      input {
        font-size: 0.95rem;
        padding: 0.8rem;
      }
      button {
        font-size: 0.95rem;
      }
    }
  </style>
</head>

<body>

  <!-- Apply dark mode instantly -->
  <script>
    (() => {
      const savedTheme = localStorage.getItem("theme") || "light";
      if (savedTheme === "dark") document.body.classList.add("dark");
    })();
  </script>

 

  <h1>💳 Buy Airtime</h1>

  <div class="form-card">
    <label for="network">Select Network</label>
    <select id="network">
      <option value="">-- Choose Network --</option>
      <option value="mtn">MTN</option>
      <option value="airtel">Airtel</option>
      <option value="glo">Glo</option>
      <option value="9mobile">9mobile</option>
    </select>

    <label for="phone">Enter Phone Number</label>
    <input type="text" id="phone" placeholder="08012345678" maxlength="11" />

    <label for="amount">Enter Amount (₦)</label>
    <input type="number" id="amount" placeholder="100" />

    <button id="buyBtn">💳 Buy Airtime</button>
    <a href="/dashboard.html" class="back">⬅ Back to Dashboard</a>
  </div>

  <script>
    // Theme logic
    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("themeBtn");

      const updateText = () => {
        btn.textContent = document.body.classList.contains("dark")
          ? "☀ Light"
          : "🌙 Dark";
      };

      updateText();

      btn.onclick = () => {
        document.body.classList.toggle("dark");
        localStorage.setItem("theme",
          document.body.classList.contains("dark") ? "dark" : "light"
        );
        updateText();
      };
    });


    // MAIN LOGIC
    document.addEventListener("DOMContentLoaded", () => {
      const token = localStorage.getItem("token");
      if (!token) {
        Swal.fire("Login Required", "Please log in.", "warning")
          .then(() => location.href = "/login.html");
        return;
      }

      const apiBase = "http://localhost:4000";
      let balance = 0;

      async function loadWallet() {
        try {
          const res = await fetch(`${apiBase}/wallet`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await res.json();
          if (res.ok) balance = data.balance;
        } catch (e) {
          Swal.fire("Error", e.message);
        }
      }

      loadWallet();

      document.getElementById("buyBtn").addEventListener("click", async () => {
        const network = document.getElementById("network").value;
        const phone = document.getElementById("phone").value;
        const amount = parseFloat(document.getElementById("amount").value);

        if (!network || !phone || !amount)
          return Swal.fire("Error", "Please fill every field.", "error");

        if (balance < amount)
          return Swal.fire("Insufficient Funds", `Wallet ₦${balance}`, "error");

        Swal.fire({
          title: "Processing...",
          text: `Buying ₦${amount} airtime...`,
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading()
        });

        try {
          const res = await fetch(`${apiBase}/api/airtime`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ network, phone, amount })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.error);

          Swal.fire("Success", data.message, "success");
          balance = data.new_balance;
        } catch (e) {
          Swal.fire("Error", e.message, "error");
        }
      });
    });
  </script>

</body>

</html>
