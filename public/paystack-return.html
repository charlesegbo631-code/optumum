<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Confirmation</title>

  <style>
    body {
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f7fb;
      color: #333;
      padding: 20px;
      margin: 0;
      text-align: center;
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 420px;
      padding: 1.8rem;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #ccc;
      border-top-color: #0a7c58;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 1.2rem auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h2 {
      font-size: 1.4rem;
      line-height: 1.3;
    }

    p {
      font-size: 1rem;
      opacity: 0.85;
    }

    .success { color: #0a7c58; }
    .error { color: #c0392b; }

    button {
      background: #0a7c58;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      margin-top: 1.3rem;
      transition: 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.93;
    }

    /* Better UI on very small screens */
    @media (max-width: 400px) {
      h2 { font-size: 1.2rem; }
      p { font-size: 0.95rem; }
      .card { padding: 1.3rem; }
    }
  </style>
</head>

<body>
  <div class="card" id="statusCard">
    <h2>⏳ Verifying your payment...</h2>
    <div class="spinner"></div>
    <p>Please wait while we confirm your transaction.</p>
  </div>

  <script>
    async function verifyPayment() {
      const query = new URLSearchParams(window.location.search);
      const reference = query.get("reference");
      const card = document.getElementById("statusCard");

      function addReturnButton() {
        const btn = document.createElement("button");
        btn.textContent = "Return to Dashboard";
        btn.addEventListener("click", () => {
          window.location.href = "/dashboard.html";
        });
        card.appendChild(btn);
      }

      if (!reference) {
        card.innerHTML = `
          <h2 class="error">❌ Invalid Payment Reference</h2>
          <p>No reference provided.</p>
        `;
        addReturnButton();
        return;
      }

      try {
        const token = localStorage.getItem("ul_token");
        const res = await fetch("/wallet/paystack/verify", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ reference })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          card.innerHTML = `
            <h2 class="success">✅ Payment Successful!</h2>
            <p>Your wallet has been funded successfully.</p>
          `;
        } else {
          card.innerHTML = `
            <h2 class="error">❌ Payment Failed</h2>
            <p>${data.error || "Unable to verify transaction."}</p>
          `;
        }

        addReturnButton();

      } catch (err) {
        card.innerHTML = `
          <h2 class="error">⚠️ Error</h2>
          <p>${err.message}</p>
        `;
        addReturnButton();
      }
    }

    verifyPayment();
  </script>
</body>
</html>
