<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support | uchenzylogs</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background-color: #f5f5f5;
      color: #222;
      transition: 0.3s ease;
    }

    /* DARK MODE */
    body.dark {
      background: #0f0f0f;
      color: #e4e4e4;
    }

    /* HEADER */
    header {
      padding: 20px;
      text-align: center;
      font-size: 26px;
      font-weight: 600;
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 16px;
    }

    /* FORM CARD */
    .form-card {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
      transition: 0.3s ease;
    }

    body.dark .form-card {
      background: #1a1a1a;
      box-shadow: 0 3px 12px rgba(255, 255, 255, 0.05);
    }

    h2 {
      margin-bottom: 12px;
      font-size: 20px;
    }

    input, textarea, button {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      transition: 0.3s ease;
    }

    body.dark input,
    body.dark textarea {
      background: #141414;
      border: 1px solid #333;
      color: #fff;
    }

    button {
      background: #007bff;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      border-radius: 8px;
    }

    button:hover {
      opacity: 0.9;
    }

    /* THEME TOGGLE */
    #themeBtn {
      position: fixed;
      top: 15px;
      right: 15px;
      background: #222;
      color: #fff;
      padding: 10px 14px;
      border-radius: 40px;
      cursor: pointer;
      border: none;
      font-size: 14px;
      z-index: 1000;
      transition: 0.25s ease;
    }

    body.dark #themeBtn {
      background: #f0f0f0;
      color: #000;
    }

    /* WHATSAPP FLOATING BUTTON */
    .whatsapp-btn {
      position: fixed;
      bottom: 22px;
      right: 20px;
      background: #25D366;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      z-index: 1000;
    }

    .whatsapp-btn img {
      width: 34px;
      height: 34px;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 480px) {
      header {
        font-size: 22px;
        padding: 16px;
      }

      .form-card {
        padding: 20px;
      }

      input, textarea, button {
        padding: 12px;
        font-size: 15px;
      }

      #themeBtn {
        padding: 8px 12px;
        font-size: 13px;
      }

      .whatsapp-btn {
        width: 52px;
        height: 52px;
      }

      .whatsapp-btn img {
        width: 30px;
        height: 30px;
      }
    }
  </style>
</head>

<body>

  <!-- THEME TOGGLE BUTTON -->
  <button id="themeBtn">🌙</button>

  <header>
    <h1>Support</h1>
  </header>

  <div class="container">
    <div class="form-card">
      <h2>Contact Support</h2>

      <form id="supportForm">
        <input type="text" id="name" placeholder="Your Name" required />
        <input type="email" id="email" placeholder="Your Email" required />
        <textarea id="message" placeholder="Your message..." rows="5" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>

  <!-- WhatsApp Floating Button -->
  <div class="whatsapp-btn" id="whatsappBtn">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" />
  </div>

  <script>
    /* THEME SYSTEM */
    const themeBtn = document.getElementById("themeBtn");
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
      themeBtn.textContent = "☀️";
    }

    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      themeBtn.textContent = isDark ? "☀️" : "🌙";
    });

    /* SUPPORT FORM */
    document.getElementById("supportForm").addEventListener("submit", function (e) {
      e.preventDefault();
      alert("Your message has been sent! Support will reach out shortly.");
      this.reset();
    });

    /* WHATSAPP BUTTON */
    document.getElementById("whatsappBtn").addEventListener("click", () => {
      window.open("https://wa.me/234810912406", "_blank");
    });
  </script>

</body>
</html>
