<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Refer & Earn | uchenzylogs</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <script src="/scripts/sweetalert2.all.min.js"></script>

  <style>
    :root {
      --bg: #f5f7fb;
      --text: #333;
      --card: #fff;
      --accent: #0a7c58;
      --ref-box: #e9ecef;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    body.dark {
      --bg: #0a101a;
      --text: #e6edf3;
      --card: #1c2128;
      --accent: #3cba92;
      --ref-box: #2a2f36;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem;
      margin: 0;
      transition: 0.3s;
    }

    h1 {
      text-align: center;
      color: var(--accent);
      margin-bottom: 1.5rem;
      font-size: 1.7rem;
    }

    .card {
      background: var(--card);
      padding: 1.8rem;
      border-radius: 14px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 4px 12px var(--shadow);
    }

    h2, h3 {
      margin-bottom: 0.7rem;
    }

    .ref-box {
      background: var(--ref-box);
      padding: 1rem;
      border-radius: 8px;
      word-break: break-all;
      margin-top: 1rem;
      font-weight: 600;
      border: 1px solid rgba(0,0,0,0.1);
      color: var(--text);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 1rem;
      width: 100%;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1.2rem;
      font-weight: 600;
      transition: 0.3s;
    }

    button:hover {
      opacity: 0.85;
    }

    .loading {
      opacity: 0.6;
      font-style: italic;
    }

    /* Phone optimization */
    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }

      .card {
        padding: 1.4rem;
        border-radius: 12px;
      }

      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

<script>
  // Load saved theme
  (() => {
    const savedTheme = localStorage.getItem("theme") || "light";
    if (savedTheme === "dark") document.body.classList.add("dark");
  })();
</script>

<h1>Refer & Earn</h1>

<div class="card">
  <h2>Your Referral Link</h2>
  <div id="refLink" class="ref-box loading">Retrieving link...</div>

  <button id="copyBtn" disabled>Copy Referral Link</button>

  <h3 style="margin-top: 1.5rem;">Your Earnings</h3>
  <p id="refEarn" class="loading">Loading earnings...</p>
</div>

<script>
const token = localStorage.getItem("token");
if (!token) {
  Swal.fire(
    "Login Required",
    "Please log in to view your referral details.",
    "warning"
  ).then(() => window.location.href = "/login.html");
}

const api = "http://localhost:4000";

async function loadReferral() {
  try {
    const res = await fetch(api + "/referral/me", {
      headers: { Authorization: "Bearer " + token }
    });

    const data = await res.json();

    if (!res.ok) {
      Swal.fire("Error", data.error || "Could not load referral data", "error");
      document.getElementById("refLink").textContent = "Error loading link";
      return;
    }

    // Create referral link
    const link = `${window.location.origin}/register.html?ref=${data.ref_code}`;

    // Update UI
    const refBox = document.getElementById("refLink");
    refBox.textContent = link;
    refBox.classList.remove("loading");

    const earnings = document.getElementById("refEarn");
    earnings.textContent = `₦${data.earnings}`;
    earnings.classList.remove("loading");

    // Enable copy button
    const copyBtn = document.getElementById("copyBtn");
    copyBtn.disabled = false;
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(link);
      Swal.fire("Copied!", "Referral link copied!", "success");
    };

  } catch (err) {
    Swal.fire("Error", "Network error: " + err.message, "error");
  }
}

loadReferral();
</script>

</body>
</html>
